version: "3.9"

services:
  benchmark:
    image: python:3.11-slim
    container_name: pyjobkit-benchmark
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - DSN=sqlite+aiosqlite:///app/jobkit.db
      - ENQUEUE_RATE=200
      - CONCURRENCY=16
    ports:
      - "7777:7777"
    command: >-
      sh -c "pip install --no-cache-dir -r benchmark/requirements.txt && cd benchmark && uvicorn web:app --host 0.0.0.0 --port 7777"
    restart: unless-stopped

