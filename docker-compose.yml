version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: pyjobkit-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru

  benchmark:
    image: python:3.13-slim
    container_name: pyjobkit-benchmark
    working_dir: /app
    depends_on:
      - redis
    environment:
      - DSN=redis://redis:6379/0
      - ENQUEUE_RATE=2000
      - CONCURRENCY=32
    ports:
      - "7777:7777"
    command: >-
      sh -c "apt-get update && apt-get install -y --no-install-recommends git \ 
      && if [ ! -d /app/.git ]; then git clone --depth 1 https://github.com/4stm4/pyjobkit-loadtest /app; else cd /app && git pull --rebase; fi \ 
      && pip install --no-cache-dir -r /app/benchmark/requirements.txt \ 
      && cd /app/benchmark \ 
      && python web.py & python app.py & wait"
    restart: unless-stopped
