version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: pyjobkit-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru

  benchmark:
    image: python:3.13-slim
    container_name: pyjobkit-benchmark
    working_dir: /app
    depends_on:
      - redis
    environment:
      - DSN=redis://redis:6379/0
      - ENQUEUE_RATE=10000
      - CONCURRENCY=64
      - HASH_ITERATIONS=100
    ports:
      - "8888:8888"
    command: >-
      sh -c "pip install --no-cache-dir -r /app/benchmark/requirements.txt
      && cd /app/benchmark
      && python web.py"
    volumes:
      - .:/app:ro
    restart: unless-stopped
