version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pg
    environment:
      POSTGRES_DB: jobkit
      POSTGRES_USER: jobkit
      POSTGRES_PASSWORD: jobkit
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  benchmark:
    build: ./benchmark
    container_name: pyjobkit-benchmark
    depends_on:
      - postgres
    environment:
      - DSN=postgresql+asyncpg://jobkit:jobkit@postgres:5432/jobkit
      - ENQUEUE_RATE=3000
      - CONCURRENCY=32
      - LOG_LEVEL=INFO
    ports:
      - "7777:7777"
    restart: unless-stopped

volumes:
  pg_data:
